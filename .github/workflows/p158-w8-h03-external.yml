name: Plan 0158 H03 External Rebinding

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed source commit
        type: string
        required: true
      manifest_run_id:
        description: Workflow run containing the frozen H03 manifest
        type: string
        required: true
      manifest_artifact_name:
        description: Artifact containing p158-w8-h03-external-manifest.json
        type: string
        required: true
      manifest_sha256:
        description: Exact frozen H03 manifest SHA-256
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: p158-w8-h03-${{ inputs.manifest_sha256 }}
  cancel-in-progress: false

jobs:
  external-rebinding:
    runs-on: ubuntu-latest
    environment: p158-external-vantage
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify reviewed commit
        env: { EXPECTED_COMMIT: '${{ inputs.expected_commit }}' }
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with: { version: 10.34.5 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '22.22.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.manifest_artifact_name }}
          run-id: ${{ inputs.manifest_run_id }}
          github-token: ${{ github.token }}
          path: manifest
      - name: Verify frozen manifest bytes
        env: { EXPECTED_MANIFEST_SHA256: '${{ inputs.manifest_sha256 }}' }
        run: test "$(sha256sum manifest/p158-w8-h03-external-manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
      - name: Execute exact H03 actions
        env:
          P158_DEV_HANDOFF_URL: ${{ secrets.P158_DEV_HANDOFF_URL }}
          P158_DEV_DASHBOARD_USERNAME: ${{ secrets.P158_DEV_DASHBOARD_USERNAME }}
          P158_DEV_DASHBOARD_PASSWORD: ${{ secrets.P158_DEV_DASHBOARD_PASSWORD }}
          P158_DEV_EXPECTED_IDENTITY_JSON: ${{ secrets.P158_DEV_EXPECTED_IDENTITY_JSON }}
          P158_DEV_PIXEL_MARKER_REGION_JSON: ${{ secrets.P158_DEV_PIXEL_MARKER_REGION_JSON }}
        run: node scripts/run-p158-w8-h03-external.js --manifest manifest/p158-w8-h03-external-manifest.json --output-dir output
      - name: Upload immutable H03 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p158-w8-h03-external-result
          path: output/
          retention-days: 2
          if-no-files-found: error
