name: Plan 0158 W8 External Dashboard

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed source commit
        type: string
        required: true
      manifest_run_id:
        description: Workflow run containing the frozen dashboard action manifest
        type: string
        required: true
      manifest_artifact_name:
        description: Artifact containing p158-w8-dashboard-external-manifest.json
        type: string
        required: true
      manifest_sha256:
        description: Exact frozen dashboard action manifest SHA-256
        type: string
        required: true
      artifact_retention_days:
        description: Restricted synthetic evidence retention
        type: choice
        required: true
        default: '2'
        options: ['1', '2', '3']

permissions:
  contents: read
  actions: read

concurrency:
  group: p158-w8-dashboard-${{ inputs.manifest_sha256 }}
  cancel-in-progress: false

jobs:
  external-dashboard:
    runs-on: ubuntu-latest
    environment: p158-external-vantage
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify reviewed commit
        env: { EXPECTED_COMMIT: '${{ inputs.expected_commit }}' }
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with: { version: 10.34.5 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '22.22.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.manifest_artifact_name }}
          run-id: ${{ inputs.manifest_run_id }}
          github-token: ${{ github.token }}
          path: manifest
      - name: Verify frozen manifest bytes
        env:
          EXPECTED_MANIFEST_SHA256: '${{ inputs.manifest_sha256 }}'
          EXPECTED_COMMIT: '${{ inputs.expected_commit }}'
        run: |
          test "$(sha256sum manifest/p158-w8-dashboard-external-manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          node -e 'const value=JSON.parse(require("fs").readFileSync("manifest/p158-w8-dashboard-external-manifest.json")); if(value.expectedCommit!==process.env.EXPECTED_COMMIT) process.exit(1)'
      - name: Execute exact external dashboard action
        env:
          AGENT_BROWSER_P158_DASHBOARD_ACTION_URL: ${{ secrets.P158_DEV_DASHBOARD_ACTION_URL }}
          AGENT_BROWSER_P158_DASHBOARD_USERNAME: ${{ secrets.P158_DEV_DASHBOARD_USERNAME }}
          AGENT_BROWSER_P158_DASHBOARD_PASSWORD: ${{ secrets.P158_DEV_DASHBOARD_PASSWORD }}
        run: |
          mkdir -p output
          node scripts/run-p158-w8-dashboard-campaign.js external-capture --input manifest/p158-w8-dashboard-external-manifest.json --output output/p158-w8-dashboard-external-result.json --apply
      - name: Upload immutable external dashboard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p158-w8-dashboard-external-result
          path: output/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
