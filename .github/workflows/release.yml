name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify release artifacts without creating a release
        type: boolean
        default: true

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  check-release:
    name: Check for new version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      needs_github_release: ${{ steps.check.outputs.needs_github_release }}
      dry_run: ${{ steps.check.outputs.dry_run }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check GitHub release state
        id: check
        run: |
          DRY_RUN="${DRY_RUN:-false}"
          echo "Dry run: $DRY_RUN"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $LOCAL_VERSION"
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

          TAG="v$LOCAL_VERSION"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run requested, building and validating release artifacts"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "needs_github_release=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" &>/dev/null; then
            echo "GitHub release $TAG exists, skipping release build"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "needs_github_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub release $TAG is missing, building release artifacts"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "needs_github_release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.name }}
    needs: check-release
    if: needs.check-release.outputs.dry_run == 'true' || needs.check-release.outputs.needs_github_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: agent-browser-linux-x64
            use_zigbuild: true
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: agent-browser-linux-arm64
            use_zigbuild: true
          - name: Linux musl x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: agent-browser-linux-musl-x64
            use_zigbuild: true
          - name: Linux musl ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: agent-browser-linux-musl-arm64
            use_zigbuild: true
          - name: Windows x64
            os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            binary: agent-browser-win32-x64.exe
            use_zigbuild: false
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: agent-browser-darwin-x64
            use_zigbuild: false
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: agent-browser-darwin-arm64
            use_zigbuild: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version
        run: pnpm run version:sync

      - name: Build dashboard
        run: pnpm --filter dashboard build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Windows cross-compilation tools
        if: runner.os == 'Linux' && matrix.target == 'x86_64-pc-windows-gnu'
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mingw-w64

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        timeout-minutes: 10
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Configure Rust linkers
        if: runner.os == 'Linux' && matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build with zigbuild
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Build with cargo
        if: '!matrix.use_zigbuild'
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Copy binary
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp cli/target/${{ matrix.target }}/release/agent-browser.exe artifacts/${{ matrix.binary }}
          else
            cp cli/target/${{ matrix.target }}/release/agent-browser artifacts/${{ matrix.binary }}
            chmod +x artifacts/${{ matrix.binary }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: artifacts/${{ matrix.binary }}
          retention-days: 7

  release-dry-run:
    name: Release dry run
    needs: [check-release, build-binaries]
    if: needs.check-release.outputs.dry_run == 'true' && needs.build-binaries.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Collect release binaries
        run: |
          mkdir -p release-assets
          find artifacts -type f -name 'agent-browser-*' -exec mv {} release-assets/ \;
          rm -rf artifacts
          chmod +x release-assets/agent-browser-linux-x64
          echo "Release binaries:"
          ls -la release-assets/

      - name: Verify release assets
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          scripts/release/verify-release-assets.sh release-assets "$VERSION" write-checksums
          scripts/release/verify-release-assets.sh release-assets "$VERSION" verify-checksums

  github-release:
    name: Create GitHub Release
    needs: [check-release, build-binaries]
    if: needs.check-release.outputs.dry_run != 'true' && needs.build-binaries.result == 'success' && needs.check-release.outputs.needs_github_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Collect release binaries
        run: |
          mkdir -p release-assets
          find artifacts -type f -name 'agent-browser-*' -exec mv {} release-assets/ \;
          rm -rf artifacts
          chmod +x release-assets/agent-browser-linux-x64
          ls -la release-assets/

      - name: Verify release assets
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          scripts/release/verify-release-assets.sh release-assets "$VERSION" write-checksums
          scripts/release/verify-release-assets.sh release-assets "$VERSION" verify-checksums

      - name: Extract changelog entry
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          node scripts/release/extract-release-notes.js \
            CHANGELOG.md "$VERSION" /tmp/release-notes.md

      - name: Create GitHub Release
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          TAG="v$VERSION"

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              release-assets/*
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release assets
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          TAG="v$VERSION"
          mkdir -p published
          gh release download "$TAG" --dir published
          chmod +x published/agent-browser-linux-x64
          scripts/release/verify-release-assets.sh published "$VERSION" verify-checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
