name: Plan 0158 External Endurance

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Frozen endurance case
        type: choice
        required: true
        options: [C04, C05]
      expected_commit:
        description: Exact reviewed source commit
        type: string
        required: true
      campaign_run_id:
        description: Frozen P158 campaign run ID
        type: string
        required: true
      dispatch_template_sha256:
        description: Frozen case dispatch-template SHA-256
        type: string
        required: true
      dispatch_template_artifact_run_id:
        description: Workflow run containing the frozen dispatch template
        type: string
        required: true
      dispatch_template_artifact_name:
        description: Artifact containing p158-w9-endurance-dispatch-template.json
        type: string
        required: true
      artifact_retention_days:
        description: Restricted evidence retention
        type: choice
        required: true
        default: '2'
        options: ['1', '2', '3']

permissions:
  contents: read
  actions: read

concurrency:
  group: p158-w9-endurance-${{ inputs.case_id }}-${{ inputs.dispatch_template_sha256 }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dispatch_sha256: ${{ steps.bind.outputs.dispatch_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify reviewed commit
        env: { EXPECTED_COMMIT: '${{ inputs.expected_commit }}' }
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.dispatch_template_artifact_name }}
          run-id: ${{ inputs.dispatch_template_artifact_run_id }}
          github-token: ${{ github.token }}
          path: template
      - name: Bind dispatch to this workflow run
        id: bind
        env:
          EXPECTED_TEMPLATE_SHA256: ${{ inputs.dispatch_template_sha256 }}
          P158_RUN_ID: ${{ inputs.campaign_run_id }}
        run: |
          mkdir -p dispatch
          node --input-type=module -e 'import fs from "node:fs"; import { sha256 } from "./scripts/lib/p158-campaign-controller.js"; const value=JSON.parse(fs.readFileSync("template/p158-w9-endurance-dispatch-template.json","utf8")); if(value.templateSha256!==process.env.EXPECTED_TEMPLATE_SHA256) process.exit(1); const {templateSha256,...body}=value; if(sha256(body)!==templateSha256) process.exit(1)'
          node scripts/run-p158-w9-endurance.js bind --template template/p158-w9-endurance-dispatch-template.json --output dispatch/p158-w9-endurance-dispatch.json
          echo "dispatch_sha256=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("dispatch/p158-w9-endurance-dispatch.json")).dispatchSha256)')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p158-${{ inputs.case_id }}-endurance-dispatch
          path: dispatch/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

  c04-segment-1:
    if: inputs.case_id == 'C04'
    needs: prepare
    runs-on: ubuntu-latest
    environment: p158-external-vantage
    timeout-minutes: 250
    steps: &first_segment_steps
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify reviewed commit
        env: { EXPECTED_COMMIT: '${{ inputs.expected_commit }}' }
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with: { version: 10.34.5 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '22.22.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Download frozen dispatch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: p158-${{ inputs.case_id }}-endurance-dispatch
          path: dispatch
      - name: Execute exact segment
        env: &live_env
          P158_DEV_HANDOFF_URL: ${{ secrets.P158_DEV_HANDOFF_URL }}
          P158_DEV_DASHBOARD_USERNAME: ${{ secrets.P158_DEV_DASHBOARD_USERNAME }}
          P158_DEV_DASHBOARD_PASSWORD: ${{ secrets.P158_DEV_DASHBOARD_PASSWORD }}
          P158_DEV_EXPECTED_IDENTITY_JSON: ${{ secrets.P158_DEV_EXPECTED_IDENTITY_JSON }}
          P158_DEV_PIXEL_MARKER_REGION_JSON: ${{ secrets.P158_DEV_PIXEL_MARKER_REGION_JSON }}
          P158_DEV_VISUAL_FIXTURE_ATTESTATION_JSON: ${{ secrets.P158_DEV_VISUAL_FIXTURE_ATTESTATION_JSON }}
          P158_RUN_ID: ${{ inputs.campaign_run_id }}
          P158_SEGMENT_INDEX: '1'
        run: |
          node scripts/run-p158-w9-endurance.js shard --dispatch dispatch/p158-w9-endurance-dispatch.json --segment-index 1 --output-dir output
      - name: Upload immutable segment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p158-${{ inputs.case_id }}-segment-1
          path: output/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

  c04-segment-2:
    if: always() && inputs.case_id == 'C04' && needs.c04-segment-1.result == 'success'
    needs: c04-segment-1
    runs-on: ubuntu-latest
    environment: p158-external-vantage
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify reviewed commit
        env: { EXPECTED_COMMIT: '${{ inputs.expected_commit }}' }
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with: { version: 10.34.5 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '22.22.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: 'p158-${{ inputs.case_id }}-endurance-dispatch', path: dispatch }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: 'p158-C04-segment-1', path: predecessor }
      - name: Execute exact segment
        env:
          P158_DEV_HANDOFF_URL: ${{ secrets.P158_DEV_HANDOFF_URL }}
          P158_DEV_DASHBOARD_USERNAME: ${{ secrets.P158_DEV_DASHBOARD_USERNAME }}
          P158_DEV_DASHBOARD_PASSWORD: ${{ secrets.P158_DEV_DASHBOARD_PASSWORD }}
          P158_DEV_EXPECTED_IDENTITY_JSON: ${{ secrets.P158_DEV_EXPECTED_IDENTITY_JSON }}
          P158_DEV_PIXEL_MARKER_REGION_JSON: ${{ secrets.P158_DEV_PIXEL_MARKER_REGION_JSON }}
          P158_DEV_VISUAL_FIXTURE_ATTESTATION_JSON: ${{ secrets.P158_DEV_VISUAL_FIXTURE_ATTESTATION_JSON }}
          P158_RUN_ID: ${{ inputs.campaign_run_id }}
          P158_SEGMENT_INDEX: '2'
        run: |
          node scripts/run-p158-w9-endurance.js shard --dispatch dispatch/p158-w9-endurance-dispatch.json --segment-index 2 --predecessor predecessor/shard-receipt.json --output-dir output
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: 'p158-C04-segment-2', path: 'output/', retention-days: '${{ inputs.artifact_retention_days }}', if-no-files-found: error }

  c05-segment-1:
    if: inputs.case_id == 'C05'
    needs: prepare
    runs-on: ubuntu-latest
    environment: p158-external-vantage
    timeout-minutes: 250
    steps: *first_segment_steps

  c05-segment-2:
    if: always() && inputs.case_id == 'C05' && needs.c05-segment-1.result == 'success'
    needs: c05-segment-1
    uses: ./.github/workflows/p158-w9-endurance-segment.yml
    with: { segment_index: 2, case_id: C05, campaign_run_id: '${{ inputs.campaign_run_id }}', expected_commit: '${{ inputs.expected_commit }}', predecessor_artifact_name: 'p158-C05-segment-1', artifact_retention_days: '${{ inputs.artifact_retention_days }}' }
    secrets: inherit
  c05-segment-3:
    if: always() && inputs.case_id == 'C05' && needs.c05-segment-2.result == 'success'
    needs: c05-segment-2
    uses: ./.github/workflows/p158-w9-endurance-segment.yml
    with: { segment_index: 3, case_id: C05, campaign_run_id: '${{ inputs.campaign_run_id }}', expected_commit: '${{ inputs.expected_commit }}', predecessor_artifact_name: 'p158-C05-segment-2', artifact_retention_days: '${{ inputs.artifact_retention_days }}' }
    secrets: inherit
  c05-segment-4:
    if: always() && inputs.case_id == 'C05' && needs.c05-segment-3.result == 'success'
    needs: c05-segment-3
    uses: ./.github/workflows/p158-w9-endurance-segment.yml
    with: { segment_index: 4, case_id: C05, campaign_run_id: '${{ inputs.campaign_run_id }}', expected_commit: '${{ inputs.expected_commit }}', predecessor_artifact_name: 'p158-C05-segment-3', artifact_retention_days: '${{ inputs.artifact_retention_days }}' }
    secrets: inherit
  c05-segment-5:
    if: always() && inputs.case_id == 'C05' && needs.c05-segment-4.result == 'success'
    needs: c05-segment-4
    uses: ./.github/workflows/p158-w9-endurance-segment.yml
    with: { segment_index: 5, case_id: C05, campaign_run_id: '${{ inputs.campaign_run_id }}', expected_commit: '${{ inputs.expected_commit }}', predecessor_artifact_name: 'p158-C05-segment-4', artifact_retention_days: '${{ inputs.artifact_retention_days }}' }
    secrets: inherit
  c05-segment-6:
    if: always() && inputs.case_id == 'C05' && needs.c05-segment-5.result == 'success'
    needs: c05-segment-5
    uses: ./.github/workflows/p158-w9-endurance-segment.yml
    with: { segment_index: 6, case_id: C05, campaign_run_id: '${{ inputs.campaign_run_id }}', expected_commit: '${{ inputs.expected_commit }}', predecessor_artifact_name: 'p158-C05-segment-5', artifact_retention_days: '${{ inputs.artifact_retention_days }}' }
    secrets: inherit

  finalize:
    if: always()
    needs: [prepare, c04-segment-1, c04-segment-2, c05-segment-1, c05-segment-2, c05-segment-3, c05-segment-4, c05-segment-5, c05-segment-6]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify reviewed commit
        env: { EXPECTED_COMMIT: '${{ inputs.expected_commit }}' }
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - if: needs.prepare.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: 'p158-${{ inputs.case_id }}-endurance-dispatch', path: dispatch }
      - name: Download C04 segments
        if: inputs.case_id == 'C04' && needs.c04-segment-2.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { pattern: 'p158-C04-segment-*', path: segments, merge-multiple: false }
      - name: Download C05 segments
        if: inputs.case_id == 'C05' && needs.c05-segment-6.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { pattern: 'p158-C05-segment-*', path: segments, merge-multiple: false }
      - name: Finalize complete chain
        if: (inputs.case_id == 'C04' && needs.c04-segment-2.result == 'success') || (inputs.case_id == 'C05' && needs.c05-segment-6.result == 'success')
        run: |
          mkdir -p final
          args=()
          for receipt in segments/*/shard-receipt.json; do args+=(--shard "$receipt"); done
          node scripts/run-p158-w9-endurance.js finalize --dispatch dispatch/p158-w9-endurance-dispatch.json "${args[@]}" --output final/final-receipt.json
      - name: Retain failed aggregate diagnosis
        if: always() && ((inputs.case_id == 'C04' && needs.c04-segment-2.result != 'success') || (inputs.case_id == 'C05' && needs.c05-segment-6.result != 'success'))
        env:
          CASE_ID: ${{ inputs.case_id }}
          DISPATCH_SHA256: ${{ needs.prepare.outputs.dispatch_sha256 }}
          C04_RESULT: ${{ needs.c04-segment-2.result }}
          C05_RESULT: ${{ needs.c05-segment-6.result }}
        run: |
          mkdir -p final
          node -e 'const fs=require("fs"); fs.writeFileSync("final/failure-receipt.json", JSON.stringify({schemaVersion:"agent-browser.p158-w9-endurance-final-failure.v1",planId:"P158",caseId:process.env.CASE_ID,dispatchSha256:process.env.DISPATCH_SHA256,terminalJobResult:process.env.CASE_ID==="C04"?process.env.C04_RESULT:process.env.C05_RESULT,success:false,retryAttempted:false,repairAttempted:false,garbageCollectionAttempted:false},null,2)+"\n",{mode:0o600})'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: 'p158-${{ inputs.case_id }}-endurance-final', path: 'final/', retention-days: '${{ inputs.artifact_retention_days }}', if-no-files-found: error }
