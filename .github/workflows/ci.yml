name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Validation Selection
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
      tier: ${{ steps.selection.outputs.tier }}
      docs: ${{ steps.selection.outputs.docs }}
      version_sync: ${{ steps.selection.outputs.version_sync }}
      rust_quality: ${{ steps.selection.outputs.rust_quality }}
      rust: ${{ steps.selection.outputs.rust }}
      dashboard: ${{ steps.selection.outputs.dashboard }}
      service_client: ${{ steps.selection.outputs.service_client }}
      service_smokes: ${{ steps.selection.outputs.service_smokes }}
      workstation: ${{ steps.selection.outputs.workstation }}
      comprehensive: ${{ steps.selection.outputs.comprehensive }}
      rust_compartments: ${{ steps.selection.outputs.rust_compartments }}
      base: ${{ steps.selection.outputs.base }}
      head: ${{ steps.selection.outputs.head }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Classify changed surfaces
        id: selection
        shell: bash
        run: |
          set -euo pipefail
          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          qualification_args=()
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
            qualification_args=(--qualification comprehensive)
          fi
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-list --max-parents=0 "$head_sha" | tail -n 1)"
          fi
          git diff --check "${base_sha}...${head_sha}"
          node scripts/dev/select-validation.js \
            --base "$base_sha" \
            --head "$head_sha" \
            --ci \
            --json \
            --github-output "$GITHUB_OUTPUT" \
            "${qualification_args[@]}" | tee validation-selection.json
          {
            echo '## Validation selection'
            echo
            echo "- Tier: \`$(jq -r .tier validation-selection.json)\`"
            echo "- Changed files: $(jq '.changedFiles | length' validation-selection.json)"
            echo "- Selected jobs: $(jq -r '.jobs | to_entries | map(select(.value) | .key) | join(", ")' validation-selection.json)"
            echo "- Exclusions: $(jq -r '.exclusions | join(", ")' validation-selection.json)"
            echo "- Unknown files: $(jq -r '.unknownFiles | join(", ")' validation-selection.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test validation control plane
        run: pnpm run test:validation-selection

      - name: Upload validation selection
        uses: actions/upload-artifact@v4
        with:
          name: validation-selection
          path: validation-selection.json

  docs:
    name: Documentation
    needs: classify
    if: needs.classify.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.head }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install documentation dependency slice
        run: pnpm install --frozen-lockfile --filter docs

      - name: Check policy and planning contracts
        run: |
          pnpm test:policy-wiring
          python .codex/skills/repo-policy-selector/scripts/audit_planning_contract.py --repo-root . --active-only

      - name: Check changed documentation links
        run: node scripts/check-documentation-links.js --base "${{ needs.classify.outputs.base }}" --head "${{ needs.classify.outputs.head }}"

      - name: Build documentation site
        run: pnpm --dir docs build

  version-sync:
    name: Version Sync Check
    needs: classify
    if: needs.classify.outputs.version_sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.classify.outputs.head }}

      - name: Check version sync
        run: node scripts/check-version-sync.js

  rust-quality:
    name: Rust Quality
    needs: classify
    if: needs.classify.outputs.rust_quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.classify.outputs.head }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Format check
        run: cargo fmt --all --manifest-path Cargo.toml -- --check

      - name: Clippy check
        run: cargo clippy --workspace --manifest-path Cargo.toml -- -D warnings

  rust-tests:
    name: Rust
    runs-on: ubuntu-latest
    needs: [classify, rust-quality]
    if: needs.classify.outputs.rust == 'true'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.classify.outputs.head }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Run affected Rust compartments
        env:
          RUST_COMPARTMENTS: ${{ needs.classify.outputs.rust_compartments }}
        run: |
          mapfile -t compartments < <(jq -r '.[]' <<< "$RUST_COMPARTMENTS")
          cli_compartments=()
          support_compartments=()
          for compartment in "${compartments[@]}"; do
            if [[ "$compartment" == cli-* ]]; then
              cli_compartments+=("$compartment")
            else
              support_compartments+=("$compartment")
            fi
          done
          run_lane() {
            local lane_status=0
            for compartment in "$@"; do
              scripts/ci/rust-tests.sh --compartment "$compartment" || lane_status=1
            done
            return "$lane_status"
          }
          set +e
          run_lane "${cli_compartments[@]}" &
          cli_pid=$!
          run_lane "${support_compartments[@]}" &
          support_pid=$!
          wait "$cli_pid"
          cli_status=$?
          wait "$support_pid"
          support_status=$?
          set -e
          if [[ "$cli_status" -ne 0 || "$support_status" -ne 0 ]]; then
            exit 1
          fi
        timeout-minutes: 30

      - name: Run no-launch service smokes
        if: needs.classify.outputs.service_smokes == 'true'
        run: |
          pnpm test:service-status-fixed-input-harness
          scripts/ci/cargo-safe.sh build --manifest-path cli/Cargo.toml
          export AGENT_BROWSER_SMOKE_AGENT_BROWSER_CMD="$PWD/cli/target/debug/agent-browser"
          node scripts/smoke-service-contracts-no-launch.js
          node scripts/smoke-mcp-read-no-launch.js
          node scripts/smoke-service-profile-sources.js
          node scripts/smoke-service-site-policy-sources.js
          node scripts/smoke-service-remedies-cli-no-launch.js
          node scripts/smoke-service-remedies-json-no-launch.js
          node scripts/smoke-service-remedies-apply-json-no-launch.js
          node scripts/smoke-service-incident-summary-http.js
          node scripts/smoke-service-incident-summary-mcp.js
        timeout-minutes: 10

  dashboard:
    name: Dashboard
    needs: classify
    if: needs.classify.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.classify.outputs.head }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --filter dashboard
        working-directory: packages/dashboard

      - name: Test dashboard contracts
        run: pnpm test:dashboard-incident-summary

      - name: Build dashboard
        run: pnpm build
        working-directory: packages/dashboard

  service-client:
    name: Service Client
    needs: classify
    if: needs.classify.outputs.service_client == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.classify.outputs.head }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install service client dependency slice
        run: pnpm install --frozen-lockfile --filter docs --filter agent-browser-service-client-example

      - name: Test browser capability registry draft
        run: pnpm test:browser-capability-registry-draft

      - name: Test service client contracts
        run: pnpm test:service-client

  workstation-fixtures:
    name: Workstation Fixtures
    needs: classify
    if: needs.classify.outputs.workstation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.classify.outputs.head }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build exact-head fixture binary
        run: cargo build --manifest-path cli/Cargo.toml

      - name: Test source-free workstation installation
        run: node scripts/test-workstation-install-fixture.js
        env:
          AGENT_BROWSER_FIXTURE_BIN: cli/target/debug/agent-browser

      - name: Test workstation host provisioning
        run: bash scripts/smoke-install-workstation-host-fixture.sh

      - name: Test fresh workstation VM harness
        run: node scripts/test-fresh-workstation-vm-harness.js

      - name: Test pinned Guacamole assets
        run: node scripts/test-workstation-guacamole-assets.js

      - name: Test PostgreSQL durability and hardening
        run: |
          node scripts/test-guacamole-postgres-durability.js
          node scripts/test-rdp-guac-postgres-hardening.js

      - name: Test route user synchronization
        run: node scripts/test-rdp-guac-route-specific-user-sync.js

      - name: Test release asset and changelog verification
        run: bash scripts/release/test-verify-release-assets.sh

  comprehensive:
    name: Comprehensive Rust
    needs: [classify, rust-quality]
    if: needs.classify.outputs.comprehensive == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.classify.outputs.head }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Run comprehensive Rust tests
        run: scripts/ci/rust-tests.sh
        timeout-minutes: 30

      - name: Run no-launch service smokes
        run: |
          pnpm test:service-status-fixed-input-harness
          scripts/ci/cargo-safe.sh build --manifest-path cli/Cargo.toml
          export AGENT_BROWSER_SMOKE_AGENT_BROWSER_CMD="$PWD/cli/target/debug/agent-browser"
          node scripts/smoke-service-contracts-no-launch.js
          node scripts/smoke-mcp-read-no-launch.js
          node scripts/smoke-service-profile-sources.js
          node scripts/smoke-service-site-policy-sources.js
          node scripts/smoke-service-remedies-cli-no-launch.js
          node scripts/smoke-service-remedies-json-no-launch.js
          node scripts/smoke-service-remedies-apply-json-no-launch.js
          node scripts/smoke-service-incident-summary-http.js
          node scripts/smoke-service-incident-summary-mcp.js
        timeout-minutes: 10

  presubmit:
    name: Presubmit
    if: always()
    needs:
      - classify
      - docs
      - version-sync
      - rust-quality
      - rust-tests
      - dashboard
      - service-client
      - workstation-fixtures
      - comprehensive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.classify.outputs.head || github.sha }}

      - name: Verify selected jobs
        shell: bash
        env:
          VALIDATION_SELECTION_JSON: ${{ needs.classify.outputs.selection }}
          VALIDATION_RESULTS_JSON: >-
            {"docs":"${{ needs.docs.result }}","versionSync":"${{ needs['version-sync'].result }}","rustQuality":"${{ needs['rust-quality'].result }}","rust":"${{ needs['rust-tests'].result }}","dashboard":"${{ needs.dashboard.result }}","serviceClient":"${{ needs['service-client'].result }}","workstation":"${{ needs['workstation-fixtures'].result }}","comprehensive":"${{ needs.comprehensive.result }}"}
        run: |
          set -euo pipefail
          node scripts/ci/verify-presubmit.js | tee presubmit-receipt.json

      - name: Record validation economics
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_SELECTION_JSON: ${{ needs.classify.outputs.selection }}
          VALIDATION_JOBS_PATH: validation-jobs.json
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > "$VALIDATION_JOBS_PATH"
          node scripts/ci/report-validation-economics.js | tee validation-economics.json

      - name: Upload presubmit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presubmit-receipts
          path: |
            presubmit-receipt.json
            validation-economics.json

  rust-cross:
    name: Rust (${{ matrix.os }} - ${{ matrix.target }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[full ci]'))
    runs-on: ${{ matrix.os }}
    needs: rust-quality
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Run Rust tests
        run: cargo test --profile ci --workspace --manifest-path Cargo.toml --target ${{ matrix.target }} -- --test-threads=1

  native-e2e:
    name: Native E2E Tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[full ci]'))
    runs-on: ubuntu-latest
    needs: comprehensive
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Chrome
        run: |
          cargo run --manifest-path cli/Cargo.toml -- install --with-deps

      - name: Run e2e tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml e2e -- --ignored --test-threads=1
        env:
          AGENT_BROWSER_PROFILE: ${{ runner.temp }}/agent-browser-native-e2e-profile

  windows-integration:
    name: Windows Integration Test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[full ci]'))
    runs-on: windows-latest
    needs: rust-cross

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build Rust CLI
        run: cargo build --release --manifest-path cli/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Copy CLI binary to bin directory
        run: |
          Copy-Item cli/target/x86_64-pc-windows-msvc/release/agent-browser.exe bin/agent-browser-win32-x64.exe

      - name: Test agent-browser install command
        run: |
          $env:PATH = "$pwd\bin;$env:PATH"
          for ($i = 1; $i -le 3; $i++) {
            bin/agent-browser-win32-x64.exe install
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Attempt $i failed, retrying in 10 seconds..."
            Start-Sleep -Seconds 10
          }
          exit 1
        shell: pwsh
        timeout-minutes: 10

      - name: Test daemon lifecycle (open, snapshot, close)
        run: |
          $env:PATH = "$pwd\bin;$env:PATH"
          Write-Host "--- Opening page ---"
          bin/agent-browser-win32-x64.exe open https://example.com
          if ($LASTEXITCODE -ne 0) { Write-Error "open failed"; exit 1 }
          Write-Host "--- Taking snapshot ---"
          $snapshot = bin/agent-browser-win32-x64.exe snapshot
          if ($LASTEXITCODE -ne 0) { Write-Error "snapshot failed"; exit 1 }
          Write-Host $snapshot
          Write-Host "--- Closing browser ---"
          bin/agent-browser-win32-x64.exe close
          if ($LASTEXITCODE -ne 0) { Write-Error "close failed"; exit 1 }
          Write-Host "--- Windows daemon lifecycle test passed ---"
        shell: pwsh
        timeout-minutes: 5

  global-install:
    name: Global Install (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[full ci]'))
    runs-on: ${{ matrix.os }}
    needs: rust-cross
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: agent-browser-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: agent-browser-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: agent-browser-win32-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build Rust CLI
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Copy CLI binary to bin directory (Unix)
        if: runner.os != 'Windows'
        run: cp cli/target/${{ matrix.target }}/release/agent-browser bin/${{ matrix.binary }}

      - name: Copy CLI binary to bin directory (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item cli/target/${{ matrix.target }}/release/agent-browser.exe bin/${{ matrix.binary }}

      - name: Test npm global install
        run: |
          npm pack
          npm install -g agent-browser-*.tgz
          agent-browser --version
        shell: bash

      - name: Verify symlink points to native binary (Unix)
        if: runner.os != 'Windows'
        run: |
          SYMLINK=$(npm prefix -g)/bin/agent-browser
          TARGET=$(readlink "$SYMLINK")
          echo "Symlink: $SYMLINK"
          echo "Target: $TARGET"
          if [[ "$TARGET" != *"${{ matrix.binary }}"* ]]; then
            echo "ERROR: Symlink should point to native binary, not JS wrapper"
            exit 1
          fi
          echo "Symlink correctly points to native binary"
        shell: bash

      - name: Verify shim points to native binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $shimPath = "$(npm prefix -g)\agent-browser.cmd"
          $content = Get-Content $shimPath -Raw
          echo "Shim path: $shimPath"
          echo "Shim content:"
          echo $content
          if ($content -notmatch "agent-browser-win32-x64\.exe") {
            echo "ERROR: Shim should point to native .exe, not JS wrapper"
            exit 1
          }
          echo "Shim correctly points to native binary"
        shell: pwsh
