name: P158 passive observation segment contract
on:
  workflow_call:
    inputs:
      case_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate-passive-segment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate zero-effect segment
        env:
          CASE_ID: ${{ inputs.case_id }}
        run: |
          test "$CASE_ID" = C04 || test "$CASE_ID" = C05
          echo "No browser action, reconnect, repair, installation block, or synchronous wait is permitted."
