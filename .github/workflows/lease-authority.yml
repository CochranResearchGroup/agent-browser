name: Lease Authority

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lease-authority.yml
      - Cargo.toml
      - Cargo.lock
      - crates/agent-browser-lease-authority/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lease-authority.yml
      - Cargo.toml
      - Cargo.lock
      - crates/agent-browser-lease-authority/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: Lease Authority (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: lease-authority-${{ matrix.target }}

      - name: Test Lease Authority crate
        run: cargo test --profile ci -p agent-browser-lease-authority --manifest-path Cargo.toml --target ${{ matrix.target }} -- --test-threads=1
