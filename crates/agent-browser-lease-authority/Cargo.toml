[package]
name = "agent-browser-lease-authority"
version = "0.1.0"
edition = "2021"
description = "Lease authority kernel for Agent Browser"
license = "Apache-2.0"
repository = "https://github.com/vercel-labs/agent-browser"
publish = false

[dependencies]
chrono = "0.4"
dirs = "5.0"
getrandom = "0.2"
hex = "0.4"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
