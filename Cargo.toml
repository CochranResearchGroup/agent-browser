[workspace]
members = [
    "cli",
    "crates/agent-browser-cdp",
    "crates/agent-browser-candidate",
    "crates/agent-browser-challenge-control",
    "crates/agent-browser-desktop-services",
    "crates/agent-browser-lease-authority",
    "crates/agent-browser-service-model",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
